name: CD

# Continuous delivery. Provider-neutral by design: build + publish a container
# image to GHCR on every push to main (and on version tags). The actual deploy
# target is a §17 open question ("a cloud account for hosting (AWS/Render)?") —
# the deploy job below is a gated placeholder until that's decided. Per AGENTS.md
# self-hosted constraint, nothing here introduces runtime external egress.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    name: Build & publish API image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Detect Dockerfile
        id: detect
        run: |
          if [ -f apps/api/Dockerfile ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No apps/api/Dockerfile yet — skipping image build. Activates when the API is containerized."
          fi

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        if: steps.detect.outputs.exists == 'true'

      # GHCR is an OCI registry and OCI repository names must be lowercase, while
      # `github.repository` preserves the owner/name casing GitHub was created with —
      # amahmoudosman96-lgtm/Watcher, with a capital W. Interpolating it straight into a
      # tag produced `invalid tag ...: repository name must be lowercase` and failed the
      # build. Lowercasing here rather than hardcoding the name keeps the workflow
      # portable to a fork or a rename.
      - name: Image name
        id: image
        if: steps.detect.outputs.exists == 'true'
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}/api" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: steps.detect.outputs.exists == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        if: steps.detect.outputs.exists == 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy
    needs: image
    runs-on: ubuntu-latest
    # Gated on the hosting decision (§17). Create a GitHub Environment named per
    # the chosen target and add its deploy credentials as secrets, then replace
    # this step. Until then the job no-ops rather than failing the pipeline.
    environment: ${{ vars.DEPLOY_ENVIRONMENT || '' }}
    steps:
      - name: Deploy (pending §17 hosting decision)
        run: |
          echo "::notice::No deploy target configured. Resolve §17 'cloud account for hosting'"
          echo "::notice::(AWS / Render / self-hosted), wire credentials, and replace this step."
