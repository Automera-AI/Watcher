# Watcher receptionist intent vocabulary (packages/intents) — roadmap item 0.3.
#
# The vocabulary is data, not code: `intents.yaml` plus a file per client, validated by
# `schema.py` and compiled to JSON by `compile.py`. Like `packages/eval`, it is exercised from
# the repo root (`python -m packages.intents.compile`) rather than installed standalone.
#
# PyYAML is a *build* dependency, not a runtime one. The application loads the compiled JSON via
# `schema.load_compiled`, and `schema` imports yaml lazily so the shipped image needs no parser.

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "watcher-intents"
version = "1.0.0"
description = "Watcher receptionist intent vocabulary — holiday homes, Dubai and Egypt."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.8,<3",
]

[project.optional-dependencies]
build = ["pyyaml>=6,<7"]

[tool.setuptools]
# Run from the repo root alongside `apps`; not packaged for distribution.
packages = []
