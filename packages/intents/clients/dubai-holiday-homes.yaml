# Example client: a Dubai holiday home operator, 40 to 150 units.
# Both channels, quotes live prices, the full language set.

client: dubai-operator-example
market: AE
currency: AED
timezone: Asia/Dubai
channels: [whatsapp, voice]
languages: [en, ar-AE, mixed]
property_system: hostaway
quote_prices: true

disabled_intents: []

# Nothing extra forced to a human. This operator has staff on shift and wants the
# receptionist to carry as much as it safely can.
force_hand_off: []

# This operator's buildings have assigned parking, so the area matters when quoting.
slot_overrides:
  availability_check: [check_in, check_out, area]
