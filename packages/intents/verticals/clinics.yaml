  - name: lost_property
    means: >
      Reporting an item forgotten or lost during a clinic visit, or asking whether a branch found
      it. A person at the relevant branch checks without promising that the item is present, held
      or safe.
    required_slots: []
    optional_slots: [branch, appointment_ref, item_description, visit_date, customer_name, phone]
    terminal_tool: handoff_to_human
    max_autonomy: hand_off
    needs_verified_identity: false
    never:
