  - name: followup_touchup_review
    means: >
      Asking about a post-treatment review, follow-up, maintenance visit or touch-up, including
      whether it is due, included, chargeable or clinically approved. Because eligibility may
      depend on the treatment record and clinical judgement, a person handles the request.
    required_slots: []
    optional_slots: [service, appointment_ref, practitioner, branch, customer_name, phone]
    terminal_tool: handoff_to_human
    max_autonomy: hand_off
    needs_verified_identity: false
    never:
      - promise that a review or touch-up is free, included or medically appropriate
      - decide whether another treatment session is needed
      - create an ordinary new booking when review eligibility is unresolved
      - disclose treatment history before identity verification
      - delay the human handoff to collect or verify identity
    confusable_with: [booking_enquiry, package_terms_question, package_account_status, clinical_question]
    examples:
      - {lang: ar-EG, text: "جلسة المتابعة بعد الفيلر إمتى؟"}
      - {lang: ar-EG, text: "الريتاتش بتاعي داخل في السعر؟"}
      - {lang: ar-EG, text: "الدكتورة قالتلي أرجع بعد أسبوعين"}
