      - {lang: ar-EG, text: "لقيتوا موبايل بعد ميعادي؟"}
      - {lang: ar-EG, text: "سيبت نضارتي في العيادة"}
      - {lang: ar-EG, text: "في حاجة ضاعت مني في غرفة الليزر"}
      - {lang: ar-EG-latin, text: "neseet shantety fel far3"}
      - {lang: en, text: "I left my phone at the clinic"}
      - {lang: mixed, text: "نسيت الـ wallet في الفرع"}

  - name: positive_feedback
    means: >
      An unsolicited compliment or positive account of a completed clinic experience, practitioner
      or staff interaction, with no unresolved request attached. Record it for the clinic and reply
      warmly without turning it into marketing or asking for a public review.
    required_slots: []
    optional_slots: [branch, service, practitioner, customer_name]
    terminal_tool: take_message
    max_autonomy: act
    needs_verified_identity: false
    never:
      - ask for a public rating or review unless the configured journey explicitly allows it
      - offer a discount, gift or benefit in exchange for praise
      - close the conversation while another request remains unanswered
      - expose staff or patient information
      - misclassify dissatisfaction or a reported reaction as positive feedback
    confusable_with: [thanks_closing, complaint, human_request, careers_business_enquiry]
    examples:
      - {lang: ar-EG, text: "الخدمة كانت ممتازة بجد"}
      - {lang: ar-EG, text: "الدكتورة كانت ذوق جداً"}
      - {lang: ar-EG, text: "النتيجة عجبتني قوي"}
      - {lang: ar-EG, text: "شكراً للفريق على التعامل الحلو"}
      - {lang: ar-EG-latin, text: "el service kanet momtaza gedan"}
      - {lang: en, text: "the team was wonderful today"}
      - {lang: mixed, text: "الـ experience كانت ممتازة"}

  # Clinical safety

  - name: clinical_question
    means: >
      Asking for personalised medical judgement about a condition or symptom, sharing a photo for
      interpretation, mentioning pregnancy, medicines, allergies or medical history in a safety or
      suitability question, or asking which treatment is likely to work for this patient. A symptom
      mentioned only as the reason for explicitly booking a dermatology consultation remains
      booking_enquiry unless it contains an urgent or emergency sign. The receptionist never
      answers a medical question.
    required_slots: []
    optional_slots: [service, branch, customer_name]
    terminal_tool: handoff_to_human
    max_autonomy: hand_off
    needs_verified_identity: false
    never:
      - diagnose, interpret a symptom, photograph, test result or medical history
      - say a treatment is safe, suitable or unsuitable for this patient
      - conduct a medical-history interview in order to decide
      - recommend a particular treatment, product or practitioner for the condition
      - promise results or reassure
    confusable_with: [service_question, preparation_aftercare_info, clinical_urgent, booking_enquiry]
    examples:
      - {lang: ar-EG, text: "أنا حامل ينفع أعمل ليزر؟"}
      - {lang: ar-EG, text: "باخد روأكيوتان ينفع أعمل الجلسة؟"}
      - {lang: ar-EG, text: "عندي حبوب في وشي أعمل إيه؟"}
      - {lang: ar-EG, text: "بصي على الصورة دي ده طبيعي؟"}
      - {lang: ar-EG-latin, text: "ana 7amel yenfa3 a3mel laser?"}
      - {lang: en, text: "is this treatment safe with my medication?"}
      - {lang: mixed, text: "عندي sensitive skin أنهي treatment يناسبني؟"}

  - name: clinical_urgent
    means: >
      Reporting a significant post-treatment problem without a current immediate-danger trigger,
      such as worsening swelling, spreading redness, strong or increasing pain, blistering, pus,
      marked heat, skin colour change or a reaction that is not settling. It is acknowledged and
      handed to a person immediately without assessment or delay.
    required_slots: []
    optional_slots: [service, appointment_ref, branch, customer_name]
    terminal_tool: handoff_to_human
    max_autonomy: hand_off
    needs_verified_identity: false
    never:
      - say the reaction is normal, expected or nothing to worry about
      - suggest a remedy, medicine, cream, ice, painkiller or dose
      - ask the patient to wait and see
      - delay handoff to collect booking details
      - downgrade an immediate-danger trigger to this intent
    confusable_with: [clinical_question, preparation_aftercare_info, complaint]
    examples:
      - {lang: ar-EG, text: "وشي وارم بعد السيشن والوجع بيزيد"}
      - {lang: ar-EG, text: "الاحمرار بينتشر مكان الليزر"}
      - {lang: ar-EG, text: "طلعلي فقاقيع بعد الجلسة"}
      - {lang: ar-EG, text: "أغمي عليا بعد الجلسة وفوقت دلوقتي"}
      - {lang: ar-EG-latin, text: "wishy warem w el wag3 beyzeed"}
      - {lang: en, text: "the swelling and pain are getting worse"}
      - {lang: mixed, text: "في severe redness بعد الـ session"}

  # Clinic information and operational support

  - name: general_info
    means: >
      Asking approved non-clinical facts about the clinic or a branch, including hours, hotline,
      walk-in policy, accessibility, parking, privacy arrangements, age policy, who the clinic
      serves or whether a listed service or device is offered at that branch.
    required_slots: []
    optional_slots: [branch, service, device, customer_name]
    terminal_tool: answer_from_knowledge
    max_autonomy: act
    needs_verified_identity: false
    never:
      - invent a branch, phone number, hour, facility, device or policy
      - state branch-specific information without establishing the branch
      - describe opening hours as live appointment availability
      - answer clinical suitability under the guise of policy
      - infer a policy from social media or another branch
    confusable_with: [directions, availability_check, service_question, practitioner_availability, named_practitioner_request]
    examples:
      - {lang: ar-EG, text: "مواعيد العمل إيه؟"}
      - {lang: ar-EG, text: "في باركينج عند الفرع؟"}
      - {lang: ar-EG, text: "لازم حجز ولا ينفع walk-in؟"}
      - {lang: ar-EG, text: "الفرع ده فيه الجهاز ده؟"}
      - {lang: ar-EG-latin, text: "mawa3eed el sho8l eh?"}
      - {lang: en, text: "is the branch wheelchair accessible?"}
      - {lang: mixed, text: "في privacy في الـ laser rooms؟"}

  - name: directions
    means: >
      Asking for a branch address, map pin, landmark, nearest branch or directions while travelling.
      The branch is established explicitly or selected from approved live branch data before any
      location is sent.
    required_slots: []
    optional_slots: [branch, current_area, customer_name]
    terminal_tool: answer_from_knowledge
    max_autonomy: act
    needs_verified_identity: false
    never:
      - invent an address, map link, landmark or branch
      - guess the nearest branch without a current area or approved location data
      - send directions to a branch different from the established booking branch
      - interpret a historical complaint about finding a branch as a current directions request
    confusable_with: [general_info, arrival_late_no_show, availability_check]
    examples:
      - {lang: ar-EG, text: "الفرع فين بالظبط؟"}
      - {lang: ar-EG, text: "ممكن تبعتولي اللوكيشن"}
      - {lang: ar-EG, text: "إيه أقرب فرع لمدينة نصر؟"}
      - {lang: ar-EG, text: "أوصل للفرع إزاي؟"}
      - {lang: ar-EG-latin, text: "el far3 fen bel zabt?"}
      - {lang: en, text: "please send me the branch location"}
      - {lang: mixed, text: "ممكن تبعتي الـ location؟"}

  - name: privacy_data_request
    means: >
      Requesting access to, correction of, deletion of or restriction on personal data, opting out
      of marketing, withdrawing consent, or reporting unwanted messages. A person handles the
      applicable privacy process. Access, correction and deletion require verification inside the
      human workflow; a current-channel marketing opt-out must take the minimal-data path without
      extra identity collection. Verification must never block the handoff itself.
    required_slots: []
    optional_slots: [customer_name, phone, channel]
    terminal_tool: handoff_to_human
    max_autonomy: hand_off
    needs_verified_identity: false
    never:
      - claim data was accessed, corrected or deleted before the process completes
      - expose stored personal data before identity verification
      - delay the human handoff to collect or verify identity
      - argue with or discourage an opt-out request
      - continue marketing after a valid opt-out has been recorded
      - provide legal conclusions or promise a statutory deadline
    confusable_with: [human_request, complaint, spam, billing_question]
    examples:
      - {lang: ar-EG, text: "امسحوا بياناتي من عندكم"}
      - {lang: ar-EG, text: "محدش يبعتلي عروض تاني"}
      - {lang: ar-EG, text: "عايزة أعرف عندكم بيانات إيه عني"}
      - {lang: ar-EG, text: "شيلوا رقمي من الرسائل"}
      - {lang: ar-EG-latin, text: "ems7o bayanaty men 3andoko"}
      - {lang: en, text: "please delete my personal data"}
      - {lang: mixed, text: "عايزة opt out من الـ marketing messages"}

  - name: complaint
    means: >
      Dissatisfaction with treatment results, waiting time, staff behaviour, hygiene, privacy,
      booking handling, call-centre service, unavailable promised items, branch access or another
      completed experience. A reported medical reaction takes clinical priority instead.
    required_slots: []
    optional_slots: [branch, service, appointment_ref, order_ref, customer_name]
    terminal_tool: handoff_to_human
    max_autonomy: hand_off
    needs_verified_identity: false
    never:
      - defend the clinic, blame the patient or say they are mistaken
      - offer compensation, credit, refund or a result guarantee
      - treat a side effect or worsening reaction as an ordinary complaint
      - disclose staff or patient information
      - promise a resolution time the handoff system did not return
    confusable_with: [clinical_urgent, billing_question, online_order_support, arrival_late_no_show]
    examples:
      - {lang: ar-EG, text: "استنيت 3 ساعات قبل الجلسة"}
      - {lang: ar-EG, text: "الكول سنتر محدش فيه ساعدني"}
      - {lang: ar-EG, text: "حجزت مع حد وكان أسلوبه مش محترم"}
      - {lang: ar-EG, text: "المنتج اللي قالوا عليه مكانش موجود في الفرع"}
      - {lang: ar-EG-latin, text: "estaneet 3 sa3at abl el jalsa"}
      - {lang: en, text: "the treatment result was very disappointing"}
      - {lang: mixed, text: "الـ reservation agent كان غير professional"}

  - name: careers_business_enquiry
    means: >
      A legitimate non-patient enquiry about employment, training, supplying, partnerships,
      corporate packages, media, events, influencer work or business development. It is recorded
      for the appropriate team and is not treated as spam merely because it is commercial.
    required_slots: []
    optional_slots: [customer_name, phone, email, organisation, enquiry_type]
    terminal_tool: take_message
    max_autonomy: act
    needs_verified_identity: false
    never:
      - promise employment, partnership, payment or a response time
      - request sensitive documents or financial information in chat
      - route a patient-care request as a business enquiry
      - engage with bulk solicitation, suspicious links or automated marketing
    confusable_with: [spam, human_request, general_info, unclear]
    examples:
      - {lang: ar-EG, text: "عايزة أقدم على شغل"}
      - {lang: ar-EG, text: "ممكن رقم مسؤول التعاقدات؟"}
      - {lang: ar-EG, text: "عايزين نتعاون معاكم في event"}
      - {lang: ar-EG, text: "إزاي أبقى supplier عندكم؟"}
      - {lang: ar-EG-latin, text: "3ayza a2adem 3ala sho8l"}
      - {lang: en, text: "I'd like to discuss a corporate partnership"}
      - {lang: mixed, text: "عندي proposal للـ marketing team"}

  - name: spam
    means: >
      Unsolicited bulk marketing, scams, phishing, suspicious links, irrelevant automated messages
      or obvious wrong-number automation. Record silently if required by operations and do not
      reply, click, unsubscribe or confirm that the number is active.
    required_slots: []
    optional_slots: []
    terminal_tool: take_message
    max_autonomy: act
    needs_verified_identity: false
    never:
      - reply
      - click or open a supplied link
      - unsubscribe when doing so confirms the number is active
      - provide clinic, staff, patient or system information
      - classify a legitimate careers or supplier enquiry as spam solely because it is commercial
    confusable_with: [careers_business_enquiry, unclear]
    examples:
      - {lang: ar-EG, text: "اربح آيفون دلوقتي واضغط على اللينك"}
      - {lang: ar-EG, text: "تم إيقاف حسابك سجل بيانات البطاقة هنا"}
      - {lang: ar-EG, text: "عرض تسويق جماعي أرسل كلمة موافق"}
      - {lang: ar-EG, text: "عميلنا العزيز تم تجديد باقة الإنترنت"}
      - {lang: ar-EG-latin, text: "eksab iphone wedos 3ala el link"}
      - {lang: en, text: "Congratulations, click here to claim your prize"}
      - {lang: mixed, text: "urgent اضغطي هنا عشان تأكدي الـ account"}

  - name: unclear
    means: >
      The message remains genuinely unintelligible or referential after using available
      conversation state. Ask one concise either-or clarification when two plausible meanings
      exist; if it still cannot be resolved, fetch a person instead of guessing.
    required_slots: []
    optional_slots: []
    terminal_tool: handoff_to_human
    max_autonomy: hand_off
    needs_verified_identity: false
    never:
      - ignore usable conversation state
      - pick the closest intent and act without sufficient evidence
      - ask more than one clarification for the same unresolved message
      - say it did not understand repeatedly
      - classify a short answer to a pending question without evaluating that state first
    confusable_with: []
    examples:
      - {lang: ar-EG, text: "؟؟"}
      - {lang: ar-EG, text: "الحاجة اللي قولتلك عليها"}
      - {lang: ar-EG, text: "هو ده"}
      - {lang: ar-EG, text: "مش عارفة أقولك"}
      - {lang: ar-EG-latin, text: "el 7aga beta3et abl keda"}
      - {lang: en, text: "the thing from before"}
      - {lang: mixed, text: "عايزة الـ thing دي"}
