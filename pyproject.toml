# Watcher — Python tooling config (API + eval).
# The build itself is not packaged yet (pre-Phase-1); this file pins the lint,
# type-check, and test configuration the CI pipeline runs against. See AGENTS.md.

[project]
name = "watcher"
version = "0.0.0"
description = "Watcher — the WhatsApp intelligence layer that turns conversations into CRM records."
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.8,<3",
    # Typed configuration over .env (apps/api/core/config.py) — the composition root reads the
    # process environment through this and nothing else parses os.environ by hand.
    "pydantic-settings>=2.4,<3",
    "fastapi>=0.115,<1",
    # Runtime dep, not test-only: the concrete LLM providers call the Anthropic and OpenAI HTTP
    # APIs directly rather than pulling in two vendor SDKs for one POST each.
    "httpx>=0.27,<1",
    "rapidfuzz>=3.9,<4",
    "sqlalchemy>=2.0,<2.1",
    "alembic>=1.13,<2",
    # Runtime, not build-only. The intent vocabulary prefers the compiled JSON, but `build/` is
    # gitignored, so an image built from this file alone has no artifact and falls back to the
    # YAML. Without this the fallback is a ModuleNotFoundError on the first turn.
    "pyyaml>=6,<7",
]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["apps/api", "packages"]
# Autogenerated Alembic migrations are not hand-maintained; don't lint/format them.
# docs/ holds one-off document generators (prose strings, long by nature), not product code.
extend-exclude = ["alembic/versions", "docs"]

[tool.ruff.lint]
# E/F: pyflakes+pycodestyle, I: import sort, UP: pyupgrade, B: bugbear, ASYNC: async pitfalls.
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
files = ["apps/api", "packages/eval", "packages/intents"]
# Pydantic v2 models are the source of truth (AGENTS.md); third-party stubs land as deps are added.
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["apps/api", "packages/eval", "packages/intents"]
