# Watcher — Python tooling config (API + eval).
# Packaged as of B3: the container image installs this project, so the dependency
# list above is the one the image resolves and there is no second copy of it in a
# Dockerfile to drift. This file also pins the lint, type-check, and test
# configuration the CI pipeline runs against. See AGENTS.md.

[project]
name = "watcher"
version = "0.0.0"
description = "Watcher — the WhatsApp intelligence layer that turns conversations into CRM records."
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.8,<3",
    # Typed configuration over .env (apps/api/core/config.py) — the composition root reads the
    # process environment through this and nothing else parses os.environ by hand.
    "pydantic-settings>=2.4,<3",
    "fastapi>=0.115,<1",
    # Runtime dep, not test-only: the concrete LLM providers call the Anthropic and OpenAI HTTP
    # APIs directly rather than pulling in two vendor SDKs for one POST each.
    "httpx>=0.27,<1",
    "rapidfuzz>=3.9,<4",
    "sqlalchemy>=2.0,<2.1",
    "alembic>=1.13,<2",
    # The Postgres driver a bare `postgresql://` URI is rewritten onto (apps/api/db/engine.py).
    # Runtime only: the tests run on SQLite, so CI does not install it — the pooling policy is a
    # pure function of the URL precisely so it can be asserted without a driver or a database.
    "psycopg[binary]>=3.2,<4",
    # The ASGI server the composition root is run by:
    #   uvicorn apps.api.main:create_application --factory --host 0.0.0.0 --port 8000
    # Nothing imports it, so it is also absent from CI's install list.
    "uvicorn[standard]>=0.30,<1",
    # Runtime, not build-only. The intent vocabulary prefers the compiled JSON, but `build/` is
    # gitignored, so an image built from this file alone has no artifact and falls back to the
    # YAML. Without this the fallback is a ModuleNotFoundError on the first turn.
    "pyyaml>=6,<7",
    # The durable queue (roadmap B5): `RedisClassificationQueue` (the producer, in the API process)
    # and `apps/api/worker.py` (the consumer, its own process) both run on this. Pulls in `redis`
    # (the asyncio client) as its own dependency — no separate pin needed here.
    "arq>=0.26,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1,<10",
    "pytest-cov>=7.1,<8",
    "mypy>=1.11,<2",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# Named explicitly rather than discovered. This is a flat layout with four top-level
# directories, two of which (`alembic`, `docs`) are not importable code; auto-discovery
# refuses to guess between them, and guessing is not what should decide what ships.
[tool.setuptools.packages.find]
include = ["apps*", "packages*"]

# The intent vocabulary is data, not code, and `packages/intents/schema.py` reads it off disk
# relative to its own file. Left out of the wheel, the image imports fine right up to the moment
# the classifier prompt is built at import time, and then dies on a missing YAML — which is what
# the first container run found. `clients/*.yaml` are the per-client overlays the same loader
# takes, and are shipped for the same reason.
[tool.setuptools.package-data]
"packages.intents" = ["*.yaml", "clients/*.yaml"]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["apps/api", "packages"]
# Autogenerated Alembic migrations are not hand-maintained; don't lint/format them.
# docs/ holds one-off document generators (prose strings, long by nature), not product code.
extend-exclude = ["alembic/versions", "docs"]

[tool.ruff.lint]
# E/F: pyflakes+pycodestyle, I: import sort, UP: pyupgrade, B: bugbear, ASYNC: async pitfalls.
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
files = ["apps/api", "packages/eval", "packages/intents"]
# Pydantic v2 models are the source of truth (AGENTS.md); third-party stubs land as deps are added.
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["apps/api", "packages/eval", "packages/intents"]
